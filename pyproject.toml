[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "execpulse-bi"
version = "0.2.1"
description = "Interactive Sales & Operations BI Dashboard built on Star-Schema Data Modeling."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Bibek Dhakal" }
]
dependencies = [
    "pandas",
    "numpy",
    "sqlalchemy",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
    "pytest-cov"
]
notebooks = [
    "jupyter",
    "ipykernel",
    "matplotlib",
    "seaborn"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src"
testpaths = [
    "tests",
]
